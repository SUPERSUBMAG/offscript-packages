name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freigegebene Pakete pruefen (SRI, Vollstaendigkeit, Unveraenderlichkeit)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/verify.py --against origin/${{ github.base_ref }}
          else
            python3 tools/verify.py --against HEAD~1 || python3 tools/verify.py
          fi
